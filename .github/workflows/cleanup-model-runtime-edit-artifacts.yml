name: Cleanup model runtime edit artifacts

on:
  push:
    branches:
      - sentient/model-worker-runtime-b
    paths:
      - .github/workflows/cleanup-model-runtime-edit-artifacts.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentient/model-worker-runtime-b
          fetch-depth: 0
      - name: Remove temporary edit-request artifacts and cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .repository-edits/requests/model-runtime-handoff-b.json \
            .repository-edits/requests/model-runtime-test-isolation-b.json \
            .repository-edits/requests/model-runtime-worker-map-b.json \
            sentient-orchestrator/tests/model-worker-runtime-z-cleanup.test.ts \
            .github/workflows/cleanup-model-runtime-edit-artifacts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary model runtime edit artifacts"
          git push origin HEAD:sentient/model-worker-runtime-b
