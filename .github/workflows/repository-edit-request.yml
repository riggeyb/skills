name: Repository Edit Request

on:
  push:
    paths:
      - ".repository-edits/requests/*.json"

permissions:
  contents: write

concurrency:
  group: repository-edit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve request
        id: request
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t requests < <(
            git diff --name-only "$BEFORE" "$AFTER" -- '.repository-edits/requests/*.json'
          )
          if [[ "${#requests[@]}" -ne 1 ]]; then
            echo "Expected exactly one changed request; found ${#requests[@]}" >&2
            exit 2
          fi
          request="${requests[0]}"
          [[ -f "$request" ]] || { echo "Request not found: $request" >&2; exit 2; }
          echo "request=$request" >> "$GITHUB_OUTPUT"

      - name: Apply deterministic edit
        run: python scripts/apply_repository_edit_request.py "${{ steps.request.outputs.request }}"

      - name: Validate repository
        run: |
          python scripts/validate_registry.py
          python scripts/check_evals.py

      - name: Inspect and commit only intended target
        shell: bash
        env:
          REQUEST: ${{ steps.request.outputs.request }}
        run: |
          set -euo pipefail
          target="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' "$REQUEST")"
          mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^...//')
          for path in "${changed[@]}"; do
            case "$path" in
              "$target"|.repository-edit-work/*) ;;
              *) echo "Unexpected changed path: $path" >&2; exit 2 ;;
            esac
          done
          rm -rf .repository-edit-work
          git diff --check
          git diff -- "$target"
          if git diff --quiet -- "$target"; then
            echo "Request produced no target change" >&2
            exit 2
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$target"
          git commit -m "Apply repository edit request"
          git push origin "HEAD:${GITHUB_REF_NAME}"
