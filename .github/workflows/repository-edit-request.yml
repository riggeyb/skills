name: Repository Edit Request

on:
  push:
    paths:
      - ".repository-edits/requests/*.json"

permissions:
  contents: write

concurrency:
  group: repository-edit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve request
        id: request
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t requests < <(
            git diff --name-only "$BEFORE" "$AFTER" -- '.repository-edits/requests/*.json'
          )
          if [[ "${#requests[@]}" -ne 1 ]]; then
            echo "Expected exactly one changed request; found ${#requests[@]}" >&2
            exit 2
          fi
          request="${requests[0]}"
          [[ -f "$request" ]] || { echo "Request not found: $request" >&2; exit 2; }
          target="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' "$request")"
          echo "request=$request" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Apply deterministic edit
        run: python scripts/apply_repository_edit_request.py "${{ steps.request.outputs.request }}"

      - name: Validate repository
        run: |
          python scripts/validate_registry.py
          python scripts/check_evals.py

      - name: Stage declared target
        shell: bash
        env:
          TARGET: ${{ steps.request.outputs.target }}
        run: |
          set -euo pipefail
          rm -rf .repository-edit-work
          git diff --check
          git add -- "$TARGET"

      - name: Certify staged target
        shell: bash
        env:
          TARGET: ${{ steps.request.outputs.target }}
        run: |
          set -euo pipefail
          mapfile -t staged < <(git diff --cached --name-only --)
          if [[ "${#staged[@]}" -ne 1 || "${staged[0]}" != "$TARGET" ]]; then
            echo "Expected exactly one staged target change: $TARGET" >&2
            printf 'Staged paths:\n' >&2
            printf '  %s\n' "${staged[@]}" >&2
            git status --porcelain=v1 >&2
            exit 2
          fi
          if git diff --cached --quiet -- "$TARGET"; then
            echo "Request produced no staged target change" >&2
            exit 2
          fi
          git diff --cached --check
          git diff --cached -- "$TARGET"

      - name: Certify no residual tracked changes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t remaining_tracked < <(git diff --name-only --)
          if [[ "${#remaining_tracked[@]}" -ne 0 ]]; then
            echo "Unexpected unstaged tracked changes remain after staging target" >&2
            printf '  %s\n' "${remaining_tracked[@]}" >&2
            exit 2
          fi

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply repository edit request"
          git push origin "HEAD:${GITHUB_REF_NAME}"
