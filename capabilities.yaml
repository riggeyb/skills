version: 2

manifest:
  name: custom-gpt-runtime-capabilities
  description: >-
    Capability inventory for Sentient's configured runtime integrations. Skills describe
    how to work; this file describes what the runtime is known to be able to observe or
    mutate. Capability declarations should track demonstrated tool surfaces, not historical
    integration names or behavior implied only by skill text.
  last_reviewed: "2026-09-21"

statuses:
  available: The capability is provided by a configured runtime integration and has been exercised successfully.
  unavailable: The capability is not provided by the configured integrations.
  runtime_dependent: Use only if an explicit tool for the capability is present in the current GPT session.

capabilities:
  skills_registry_read:
    status: available
    provider: github-skills-action
    mutating: false
    operations:
      - read registry.yaml
      - read policies/skill-loading.md
      - read capabilities.yaml
    scope:
      - riggeyb/skills control-plane files

  github_repository_read:
    status: available
    provider: github-skills-action
    mutating: false
    operations:
      - read repository content at an explicit ref
      - list repository root
      - discover registered paths through Git trees
      - read branch identity
    scope:
      - repositories and paths permitted by the configured GitHub Action and skill-loading policy

  github_repository_write:
    status: available
    provider: github-skills-action
    mutating: true
    operations:
      - create branch from an exact commit SHA
      - create file
      - replace file with current blob SHA concurrency guard
      - delete file with current blob SHA concurrency guard
      - open pull request
    guarantees:
      - writes are explicit repository operations
      - update and delete operations can use optimistic concurrency
      - branch creation can pin an exact source commit
    note: >-
      Availability means the configured Action exposes these primitives. It does not authorize
      every mutation. Apply repository-engineering policy, preserve exact bytes, and verify writes
      by rereading the resulting repository state.

  github_pull_request_read:
    status: available
    provider: github-skills-action
    mutating: false
    operations:
      - read pull request state and head/base identities
      - enumerate changed files and patches when GitHub supplies them
    guarantees:
      - pull request head SHA can be compared with independently observed commit and workflow evidence

  github_actions_evidence_read:
    status: available
    provider: github-skills-action
    mutating: false
    operations:
      - list workflow runs with branch, event, status, and exact head SHA filters
      - read a workflow run
      - enumerate workflow jobs
      - enumerate workflow artifact metadata
      - read workflow artifact metadata
    limitations:
      - artifact ZIP contents are not exposed by this capability
      - workflow job log download is declared in the Action schema but has not been demonstrated as present in the conversational runtime
    guarantees:
      - workflow and job observations can be bound to an exact head SHA
      - artifact metadata is evidence about an artifact, not evidence of its uninspected contents

  github_commit_evidence_read:
    status: available
    provider: github-skills-action
    mutating: false
    operations:
      - read commit identity and metadata
      - enumerate commit check runs
      - read combined legacy commit status
    guarantees:
      - checks and legacy statuses remain separate evidence channels
      - exact commit SHA is the identity boundary for certification claims

  github_tree_discovery:
    status: available
    provider: github-skills-action
    mutating: false
    scope:
      - registered repositories only
      - skill_globs and reference_globs discovery only

  deterministic_repository_edit:
    status: available
    provider: repository-edit-request-workflow
    mutating: true
    scope:
      - riggeyb/skills repository
      - edit operations supported by scripts/apply_repository_edit_request.py
    operations:
      - insert exact bytes after a unique anchor
      - replace exact unique bytes with exact replacement bytes
    requires:
      - an exact source Git blob SHA or SHA-256 precondition
      - a deterministic edit request committed to .repository-edits/requests/
    guarantees:
      - source identity is checked before mutation
      - unique-match operations reject missing or ambiguous targets
      - repository-owned workflow applies the requested deterministic transform
      - workflow validation can reject stale or invalid edits
      - a successful mutation creates a new commit SHA that must be reread and recertified
    note: >-
      This capability composes the GitHub Action's repository write primitives with a repository-owned
      GitHub Actions workflow. It is narrower than arbitrary local patching and should be preferred for
      exact structured edits when its supported operations fit the change.

  repository_verification:
    status: available
    provider: verification-gateway
    mutating: true
    scope:
      - repositories explicitly allowlisted by the Verification Gateway
      - exact commit SHAs containing .gpt/verification.yaml
    guarantees:
      - repository-owned verification profiles
      - exact-SHA checkout
      - GitHub Actions execution
      - durable evidence artifacts
      - branch-head equality check for certification
    note: >-
      A verification run may be called certified only when the gateway reports certified=true.
      A passing workflow on an older SHA is not certification for a newer branch head.

  repository_content_transform:
    status: runtime_dependent
    provider: repository-engineering-runtime
    mutating: false
    requires:
      - exact repository content materialization or an opaque content handle
      - deterministic local file transformation
      - exact transformed-content handoff to the repository writer
    guarantees:
      - source bytes do not need to be reconstructed by the model
      - transformations can enforce explicit preconditions before remote mutation
      - expected result bytes can be hashed and compared with a post-write reread
    note: >-
      Do not infer a general content-transfer path merely because repository read and write tools
      exist. The deterministic_repository_edit capability above is independently available for its
      narrower repository-owned request format.

  arbitrary_http_requests:
    status: unavailable
    provider: github-skills-action
    mutating: false
    override_if_explicit_tool_present: true

  shell_execution:
    status: runtime_dependent
    mutating: true
    note: >-
      Verification profiles may execute shell commands inside isolated GitHub Actions runners, but
      that does not grant the conversational GPT a general remote shell.

  python_execution:
    status: runtime_dependent
    mutating: true

  browser_automation:
    status: runtime_dependent
    mutating: true
    note: >-
      A repository verification profile may include Playwright or another browser test suite when
      the repository installs and configures it. A separate explicit browser tool may also establish
      this capability for the current session.

  web_search:
    status: runtime_dependent
    mutating: false

  image_generation:
    status: runtime_dependent
    mutating: true

  file_reading:
    status: runtime_dependent
    mutating: false

  external_app_actions:
    status: runtime_dependent
    mutating: true

policy:
  require_capability_check_before_tool_use: true
  unavailable_behavior: >-
    Do not claim, simulate, or imply that an unavailable capability was executed. Explain the
    limitation or use an available alternative.
  runtime_dependent_behavior: >-
    Verify that a concrete tool is actually available in the current session before relying on the
    capability. Skill text alone never creates a capability.
  available_behavior: >-
    Availability establishes that the runtime exposes the primitive, not that every use is authorized
    or that an operation succeeded. Apply task policy, inspect returned evidence, and distinguish
    capability presence from execution success.
  read_only_initiative: >-
    When an available read-only capability can materially reduce uncertainty, prefer using it without
    stopping for permission unless a higher-priority instruction requires otherwise.
  mutation_behavior: >-
    Use available mutation capabilities when authorized by the task and governing policy. Before a
    consequential write, identify the target identity and preconditions; after the write, treat prior
    target-bound evidence as stale and verify the resulting state.
  exact_sha_evidence: >-
    For GitHub certification, bind pull request, workflow, job, check-run, status, and commit evidence
    to the same exact SHA. Resolve contradictory observations by identity, freshness, and authority.
  skill_tool_declarations_are_advisory: true
  success_requires_observed_evidence: true
  verification_claim_requires_gateway_certification: true
