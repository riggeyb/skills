version: 1

manifest:
  name: custom-gpt-runtime-capabilities
  description: >-
    Conservative capability inventory for skills loaded through the GitHub Skills
    Action and the repository Verification Gateway. Skills describe how to work;
    this file describes what the runtime is actually known to be able to do.
  last_reviewed: "2026-09-20"

statuses:
  available: The capability is provided by a configured runtime integration.
  unavailable: The capability is not provided by the configured integrations.
  runtime_dependent: Use only if an explicit tool for the capability is present in the current GPT session.

capabilities:
  skills_registry_read:
    status: available
    provider: github-skills-action
    mutating: false
    scope:
      - riggeyb/skills registry and policy files

  github_repository_read:
    status: available
    provider: github-skills-action
    mutating: false
    scope:
      - repositories explicitly registered in registry.yaml
      - paths permitted by registry.yaml and policies/skill-loading.md

  github_tree_discovery:
    status: available
    provider: github-skills-action
    mutating: false
    scope:
      - registered repositories only
      - skill_globs and reference_globs discovery only

  repository_verification:
    status: available
    provider: verification-gateway
    mutating: true
    scope:
      - repositories explicitly allowlisted by the Verification Gateway
      - exact commit SHAs containing .gpt/verification.yaml
    guarantees:
      - repository-owned verification profiles
      - exact-SHA checkout
      - GitHub Actions execution
      - durable evidence artifacts
      - branch-head equality check for certification
    note: >-
      A verification run may be called certified only when the gateway reports
      certified=true. A passing workflow on an older SHA is not certification for
      a newer branch head.

  github_repository_write:
    status: runtime_dependent
    provider: github-writer-action
    mutating: true
    note: >-
      When the GitHub Repository Writer Action is configured in the current GPT,
      it can create branches, create or update files, delete files, and open pull requests.
      Verify that those writer operations are actually present before relying on them.

  repository_content_transform:
    status: runtime_dependent
    provider: repository-engineering-runtime
    mutating: false
    requires:
      - exact repository content materialization or an opaque content handle
      - deterministic local file transformation
      - exact transformed-content handoff to the repository writer
    guarantees:
      - source bytes do not need to be reconstructed by the model
      - transformations can enforce explicit preconditions before any remote mutation
      - expected result bytes can be hashed and compared with a post-write reread
    note: >-
      Repository read, local execution, file access, and repository write capabilities
      do not independently establish this composition. Treat this capability as present
      only when the current runtime exposes a concrete transfer path between them. The
      repository helper scripts/prepare_repository_edit.py can perform deterministic
      byte-level preparation once exact source content has been materialized locally.

  arbitrary_http_requests:
    status: unavailable
    provider: github-skills-action
    mutating: false
    override_if_explicit_tool_present: true

  shell_execution:
    status: runtime_dependent
    mutating: true
    note: >-
      Verification profiles may execute shell commands inside isolated GitHub Actions
      runners, but that does not grant the conversational GPT a general remote shell.

  python_execution:
    status: runtime_dependent
    mutating: true

  browser_automation:
    status: runtime_dependent
    mutating: true
    note: >-
      A repository verification profile may include Playwright or another browser
      test suite when the repository installs and configures it.

  web_search:
    status: runtime_dependent
    mutating: false

  image_generation:
    status: runtime_dependent
    mutating: true

  file_reading:
    status: runtime_dependent
    mutating: false

  external_app_actions:
    status: runtime_dependent
    mutating: true

policy:
  require_capability_check_before_tool_use: true
  require_composition_capability_for_exact_repository_mutations: true
  unavailable_behavior: >-
    Do not claim, simulate, or imply that an unavailable capability was executed.
    Explain the limitation or use an available alternative.
  runtime_dependent_behavior: >-
    Verify that a concrete tool is actually available in the current session before
    relying on the capability. Skill text alone never creates a capability.
  skill_tool_declarations_are_advisory: true
  success_requires_observed_evidence: true
  verification_claim_requires_gateway_certification: true
